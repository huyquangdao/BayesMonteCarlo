###
# Bayes-Adaptive LLM config for persuasion (P4G).
# Designed to run SFT on the P4G dataset and then DPO on preference pairs.
###

# Backbone (reduced for 8GB GPU)
tokenizer: meta-llama/Meta-Llama-3.1-8B-Instruct
plm: meta-llama/Meta-Llama-3.1-8B-Instruct
lm_size: 768
cached_dir: "cache/BAYES/"
dropout: 0.1
combined_action: false
saved_dir: checkpoints/negotiation/craigslist_bargain/BayesAdaptiveLLMModel
dpo_adapter_folder: dpo_adapter
sft_adapter_folder: sft_adapter    


# Training toggles
run_sft: false
run_dpo: true
run_preference_search: false   # MCTS preference search handled separately
run_offline_eval: false
run_online_eval: false
run_simulator_analysis: false

# Evaluation flags
# eval_by_sft: false
# eval_by_dpo: true

# eval_by_sft: true
# eval_by_dpo: false

#=======================

max_gen_length: 256
max_gen_tokens: 256


#Collect Preference pairs hyperparameters
skip_to_dialog_idx: 0


# SFT hyperparameters (memory-friendly)
use_lora: true
batch_size: 2
gradient_accumulation: 16
learning_rate: 2e-5
warmup_ratio: 0.05
weight_decay: 0.1
num_train_epochs: 1
logging_steps: 10
save_total_limit: 2
max_grad_norm: 0.3
max_sequence_length: 1024


# ===== General precision / memory flags =====
fp16: false
bf16: true
gradient_checkpointing: false

# DPO-specific
dpo_max_length: 1024          # max_length
max_prompt_length: 512        # max_prompt_length

dpo_train_batch_size: 2             # per_device_train_batch_size / eval_batch_size
dpo_eval_batch_size: 1              # per_device_eval_batch_size / eval_batch_size
dpo_epochs: 2                 # epochs

dpo_learning_rate: 1e-5       # learning_rate
dpo_beta: 0.1                 # beta
dpo_warmup_ratio: 0.1         # warmup_ratio

dpo_gradient_accumulation: 8  # grad_accum
dpo_max_grad_norm: 1.0        # max_grad_norm

dpo_optimizer: adamw_torch_fused   # optimizer_type
dpo_lr_scheduler_type: cosine      # lr_scheduler_type

dpo_fp16: false                # use_fp16
dpo_bf16: true                 # use_bf16
dpo_loss_type: sigmoid         


# Path to preference pairs (jsonl) used for DPO; each row should include
preference_pairs_path: "data/neg_data/preference_pairs_llama3.1.jsonl"

